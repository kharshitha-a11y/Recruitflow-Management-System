# =============================================================================
# RecruitFlow – Enterprise Full Stack Docker Compose Architecture
# Single-URL unified container architecture on Port 10000
# =============================================================================
# Services:
#   1. db: PostgreSQL 16 relational database
#   2. app: Unified production container (Nginx Reverse Proxy, FastAPI, Streamlit)
# =============================================================================

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: recruitflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-recruitflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-recruitflow_pass}
      POSTGRES_DB: ${DB_NAME:-recruitflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-recruitflow_user} -d ${DB_NAME:-recruitflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitflow-unified-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=10000
      - DB_USER=${DB_USER:-recruitflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-recruitflow_pass}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-recruitflow}
      - BACKEND_API_URL=http://127.0.0.1:8000
      - CORS_ORIGINS=http://localhost:10000,http://127.0.0.1:10000
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:10000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  pgdata:
    driver: local
