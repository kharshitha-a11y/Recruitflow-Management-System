[pytest]
# Discover tests in both the root-level test file and the tests/ directory
testpaths = . tests

# Only collect files matching these patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short test summary info for failed tests
addopts = -v --tb=short

# Filter out SQLAlchemy internal warnings
filterwarnings =
    ignore::DeprecationWarning
